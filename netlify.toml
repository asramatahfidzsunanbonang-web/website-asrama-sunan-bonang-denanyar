# Konfigurasi Build & Hosting Netlify untuk SiTahfidz Pondok
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/admin"
  to = "/admin-tahfidz.html"
  status = 200

[[redirects]]
  from = "/ustadz"
  to = "/panel-ustadz.html"
  status = 200

[[redirects]]
  from = "/wali"
  to = "/portal-wali.html"
  status = 200
